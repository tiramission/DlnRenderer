on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: install winapp portable
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winappcli/releases/download/v0.7.1/winappcli-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'w.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'winapp'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $dest 'winapp.exe') --version
      - name: probe tool
        shell: pwsh
        run: |
          Write-Host "=== winapp tool -- makeappx /? ==="
          $out = & winapp tool -- makeappx /? 2>&1
          Write-Host "exitcode=$LASTEXITCODE"
          $out | ForEach-Object { Write-Host "OUT: $_" }
          Write-Host "=== kits ==="
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
      - name: probe package only
        shell: pwsh
        run: |
          $out = & winapp tool -- makeappx 2>&1
          Write-Host "no-args exit=$LASTEXITCODE"
          $out | ForEach-Object { Write-Host "OUT: $_" }
