on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: winget available?
        shell: pwsh
        run: |
          Write-Host "winget: $((Get-Command winget -ErrorAction SilentlyContinue).Source)"
          winget --version
      - name: install winapp via winget
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --id Microsoft.WinAppCli --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity 2>&1 | Out-String
          Write-Host "exit=$LASTEXITCODE"
      - name: did winapp appear
        shell: pwsh
        run: |
          Write-Host "winapp: $((Get-Command winapp -ErrorAction SilentlyContinue).Source)"
          Get-AppxPackage -Name winapp | Select-Object Name, Version, InstallLocation | Format-List
          $p = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winapp.exe"
          Write-Host "WindowsApps path exists: $(Test-Path $p)"
          if (Test-Path $p) { & $p --version }
      - name: makeappx exit code semantics
        shell: pwsh
        run: |
          $bin = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          Write-Host "26100 makeappx exists: $(Test-Path $bin)"
          if (Test-Path $bin) {
            & $bin /? | Out-Null
            Write-Host "makeappx /? exit=$LASTEXITCODE"
          }
