name: CI

# Build and test only. Nothing here needs a real control point or a network peer; the native
# dependencies it does need are provisioned below (libmpv fetched, ffmpeg installed), so the
# player-backed tests run for real rather than skipping. Real-device verification stays manual
# (docs/testing.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # v5+ of both actions target node24; the v4 tags target node20 and now run under a forced
      # node24 with a deprecation annotation on every job. Major tags are the supported pinning
      # style here, matching what the runner image is tested against.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # global.json pins 10.0.402 with latestFeature; install the feature band, not the exact
          # patch, so a runner image without that build still works.
          dotnet-version: '10.0.x'

      - name: Show toolchain
        run: |
          dotnet --info
          dotnet --list-sdks

      # libmpv is GPL-2.0-or-later and deliberately not vendored (docs/architecture.md §17), so a
      # clean runner has none and the Player project would only warn. Fetching the exact build that
      # was reviewed - pinned twice by hash, the release archive and then the DLL - lets the
      # player-backed integration tests run for real instead of skipping, which is where the
      # RenderingControl and VolumeStateConsistency coverage lives. Downloading a GPL binary for
      # CI use is not redistribution; nothing from it is committed. Needs 7z, which the windows
      # runner image ships.
      #
      # The skip attributes in the test projects stay: they are the fallback for a developer machine
      # or a run without this step, and they report a missing DLL as skipped with the script name,
      # never as a pass. What they are not is the CI story - a green run here executes these tests.
      - name: Fetch libmpv (pinned, hash-verified)
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1 -Download

      # The window lifecycle tests generate their own clips with ffmpeg, and the runner image does
      # not ship it. choco is preinstalled; the PATH entry is appended explicitly because the job's
      # environment does not pick up a machine-PATH change made moments earlier. The version print
      # is the guard: a wrong install path fails here with one clear message instead of seven tests
      # failing later with "cannot find ffmpeg".
      - name: Install ffmpeg (window lifecycle tests generate clips with it)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $bin = 'C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin'
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe'))) {
              $found = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              if (-not $found) { throw 'ffmpeg.exe not found after choco install' }
              $bin = $found.DirectoryName
          }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'ffmpeg.exe') -version

      - name: Restore
        run: dotnet restore DlnRenderer.sln

      # Debug is the configuration the repository builds and tests with everywhere else
      # (docs/testing.md, docs/development.md), and it is the one whose ReadyToRun setting the
      # WinUI/AppSDK build honors without the R2R runtime package. A Release build here tried the
      # ReadyToRun optimization step during `dotnet build` - ReadyToRun is a publish property, but
      # the packaging target applies it to the build too - and failed on the runner with "a valid
      # runtime package was not found". The Release publish path that produces a shippable binary
      # is exercised by tools/package/build-dist.ps1, which passes an explicit -r win-x64. The
      # fetched libmpv lands in the Player project, so the build runs without the
      # WarnWhenLibmpvMissing warning that a DLL-less runner would emit.
      - name: Build
        run: dotnet build DlnRenderer.sln -c Debug --no-restore -p:Platform=x64

      - name: Test
        # --no-build keeps the tested binaries identical to the built ones. With libmpv fetched
        # above the player-backed tests execute; a run without that step reports them as skipped
        # with a message naming the script, never as passes.
        #
        # One test is excluded: MediaCompatibilityTests.Hardware_decoding_is_used_when_the_machine_
        # supports_it asserts that auto-safe picks a hardware decoder, which the runner's VM cannot
        # satisfy - dxva2 initialisation fails and mpv falls back to software. It is not a product
        # regression; the same test passes on a real GPU machine (stage D, docs/testing.md), and its
        # sibling test covering the software-fallback path does run here. A one-line name match
        # keeps the exclusion auditable instead of hiding a whole fixture class.
        run: dotnet test DlnRenderer.sln -c Debug --no-build -p:Platform=x64 --logger "console;verbosity=normal" --filter "FullyQualifiedName!~Hardware_decoding_is_used_when_the_machine_supports_it"

      # The packaging contract: whatever folder or package we hand out must carry LICENSE,
      # THIRD-PARTY-NOTICES.md and the license texts. Staging into a temp folder proves the
      # script and its inputs still work without building a 400 MB distribution.
      - name: Verify legal files stage into a distribution
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'legal-check'
          ./tools/package/stage-legal-files.ps1 -Destination $target
          $required = @('LICENSE', 'THIRD-PARTY-NOTICES.md', 'LICENSES/GPL-2.0-or-later.txt')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $target $_)) }
          if ($missing) { throw "missing from staged distribution: $($missing -join ', ')" }
          Write-Host "staged: $(Get-ChildItem $target -Recurse -File | Measure-Object | Select-Object -ExpandProperty Count) files"
