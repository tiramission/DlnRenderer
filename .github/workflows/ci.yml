name: CI

# Build and test only. Nothing here needs a real libmpv, a real control point or a network peer:
# the player integration tests skip themselves when libmpv-2.dll is absent (TestSupport), which is
# why this can run on a clean Windows runner. Real-device verification stays manual (docs/testing.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.402 with latestFeature; install the feature band, not the exact
          # patch, so a runner image without that build still works.
          dotnet-version: '10.0.x'

      - name: Show toolchain
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        run: dotnet restore DlnRenderer.sln

      # Debug is the configuration the repository builds and tests with everywhere else
      # (docs/testing.md, docs/development.md), and it is the one whose ReadyToRun setting the
      # WinUI/AppSDK build honors without the R2R runtime package. A Release build here tried the
      # ReadyToRun optimization step during `dotnet build` - ReadyToRun is a publish property, but
      # the packaging target applies it to the build too - and failed on the runner with "a valid
      # runtime package was not found". The Release publish path that produces a shippable binary
      # is exercised by tools/package/build-dist.ps1, which passes an explicit -r win-x64; that
      # stays out of CI because it needs libmpv and a real runtime. Platform=x64 keeps the
      # RID-specific App off AnyCPU. No libmpv is present, so the Player project warns instead of
      # failing, and playback integration tests skip rather than pass.
      - name: Build
        run: dotnet build DlnRenderer.sln -c Debug --no-restore -p:Platform=x64

      - name: Test
        # --no-build keeps the tested binaries identical to the built ones.
        run: dotnet test DlnRenderer.sln -c Debug --no-build -p:Platform=x64 --logger "console;verbosity=normal"

      # The packaging contract: whatever folder or package we hand out must carry LICENSE,
      # THIRD-PARTY-NOTICES.md and the license texts. Staging into a temp folder proves the
      # script and its inputs still work without building a 400 MB distribution.
      - name: Verify legal files stage into a distribution
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'legal-check'
          ./tools/package/stage-legal-files.ps1 -Destination $target
          $required = @('LICENSE', 'THIRD-PARTY-NOTICES.md', 'LICENSES/GPL-2.0-or-later.txt')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $target $_)) }
          if ($missing) { throw "missing from staged distribution: $($missing -join ', ')" }
          Write-Host "staged: $(Get-ChildItem $target -Recurse -File | Measure-Object | Select-Object -ExpandProperty Count) files"
